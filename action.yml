name: 'Setup crane'
description: 'Install and authorize crane'
branding:
  icon: box
  color: green
inputs:
  version:
    description: 'Version of crane to install (tip, latest-release, v0.5.1, etc.)'
    required: true
    default: 'latest-release'
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RUNNER_OS: ${{ runner.os }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -ex

        # Install crane:
        # - if version is "tip", install from tip of main.
        # - if version is "latest-release", use the latest release URL.
        # - otherwise, install the specified version.
        case "${VERSION}" in
        tip)
          echo "Installing crane using go get"
          go install github.com/google/go-containerregistry/cmd/crane@main
          ;;
        latest-release)
          url="https://github.com/google/go-containerregistry/releases/latest/download"
          ;;
        *)
          url="https://github.com/google/go-containerregistry/releases/download/${VERSION}"
        esac

        os="${RUNNER_OS}"
        if [[ "$os" == "macOS" ]]; then
          os="Darwin"
        fi

        arch=$(uname -m)
        if [[ "$arch" =~ (aarch64|arm64) ]] ; then
          arch=arm64
        fi

        out=crane
        if [[ "${os}" == "Windows" ]]; then
          out=crane.exe
        fi

        if [[ ! -z ${url} ]]; then
          echo "Installing crane for ${os} on ${arch}"
          tmp=$(mktemp -d)
          cd ${tmp}
          fname="go-containerregistry_${os}_${arch}.tar.gz"
          curl -o "$fname" -fsSL --retry 5 --retry-delay 1 --retry-all-errors "${url}/${fname}"
          tar xzf "$fname" "${out}"
          chmod +x "${tmp}/${out}"
          PATH=${PATH}:${tmp}
          echo "${tmp}" >> $GITHUB_PATH
        fi

        # NB: username doesn't seem to matter.
        echo "${GITHUB_TOKEN}" | crane auth login ghcr.io --username "dummy" --password-stdin
