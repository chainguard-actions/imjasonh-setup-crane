name: Test setup-crane specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.19.1
      - name: Assert crane is installed and on PATH
        run: |
          echo "Checking crane is available..."
          if ! command -v crane &>/dev/null; then
            echo "FAIL: crane not found on PATH"
            exit 1
          fi
          echo "PASS: crane found at $(command -v crane)"
      - name: Assert crane reports expected version
        run: |
          echo "Running crane version..."
          VERSION_OUTPUT=$(crane version 2>&1)
          echo "crane version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "0.19.1"; then
            echo "PASS: crane version matches v0.19.1"
          else
            echo "FAIL: expected version 0.19.1 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
