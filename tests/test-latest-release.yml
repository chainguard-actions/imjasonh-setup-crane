name: Test setup-crane latest-release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-crane
        uses: .
        with:
          version: latest-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert crane is installed and on PATH
        run: |
          echo "Checking crane is available..."
          if ! command -v crane &>/dev/null; then
            echo "FAIL: crane not found on PATH"
            exit 1
          fi
          echo "crane found at: $(which crane)"
          crane version
          echo "PASS"
